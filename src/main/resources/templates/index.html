<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Security Camera Monitor - Night 1</title>
    <link rel="stylesheet" th:href="@{/css/monitor.css}">
</head>
<body>
<div class="crt-overlay"></div>

<div class="monitor-container">

    <!-- Easter Egg Container -->
    <div class="easter-egg-container">
        <img src="/images/housemd.jpg" class="easter-egg housemd" alt="Easter Egg House">
        <img src="/images/spino.png" class="easter-egg spino" alt="Easter Egg Spino">
    </div>

    <!-- HUD  -->
    <div class="hud top-right">
        <span id="clock">12 AM</span><br>
        <span class="subtext">NIGHT 1</span>
    </div>

    <div class="hud bottom-left">
        <span>POWER LEFT: 99%</span><br>
        <span class="usage">USAGE: <span class="green-bar"></span><span class="green-bar"></span></span>
    </div>

    <div class="camera-feed" id="feed-display">
        <h1 class="camera-title" id="cam-title">CAM 1A - STAGE</h1>
    </div>

    <!-- FNAF Camera Return Bar (yung double vertical v na mahaba); specific ganyan siya para mukha siyang legit-->
    <a th:href="@{/menu}" class="monitor-flip-bar" title="Exit Monitor / Main Menu">
        <svg class="flip-icon" viewBox="0 0 120 32" xmlns="http://www.w3.org/2000/svg">
            <path d="M 25,7 L 60,15 L 95,7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 25,16 L 60,24 L 95,16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </a>

    <!-- Camera Map Layout -->
    <div class="map-layout">
        <!-- Portfolio Links -->
        <a th:href="@{/portfolio/josh}" class="cam-btn">CAM 1A</a>
        <a th:href="@{/portfolio/ken}" class="cam-btn">CAM 1B</a>
        <a th:href="@{/portfolio/klarc}" class="cam-btn">CAM 2A</a>
        <a th:href="@{/portfolio/rey}" class="cam-btn">CAM 2B</a>

        <!-- Jumpscare Links -->
        <a th:href="@{/jumpscare/cam3}" class="cam-btn jumpscare">CAM 3</a>
        <a th:href="@{/jumpscare/cam4a}" class="cam-btn jumpscare">CAM 4A</a>
        <a th:href="@{/jumpscare/cam5}" class="cam-btn jumpscare">CAM 5</a>
        <a th:href="@{/jumpscare/cam6}" class="cam-btn jumpscare">CAM 6</a>
    </div>
</div>
</body>
</html>
