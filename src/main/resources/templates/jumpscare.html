<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Jumpscare Feed</title>
    <link rel="stylesheet" th:href="@{/css/monitor.css}">
</head>
<body style="background-color: #000; color: red; text-align: center; font-family: 'Courier New', monospace; padding-top: 50px;">
<div class="crt-overlay"></div>

<h1 th:text="${title}" style="font-size: 32px; letter-spacing: 2px;">CAMERA FEED</h1>

<!-- IF CAM 5 -->
<div th:if="${videoUrl != null}" style="margin: 30px auto;">
    <iframe width="640" height="360"
            th:src="${videoUrl}"
            title="Rick Roll Feed"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            style="border: 4px solid red; box-shadow: 0 0 20px red;"
            allowfullscreen>
    </iframe>
</div>

<!-- ELSE  -->
<div th:if="${videoUrl == null}">
    <div style="margin: 30px auto;">
        <img th:src="${image}" alt="Jumpscare" style="max-width: 500px; border: 4px solid red; box-shadow: 0 0 20px red;">
    </div>
    <audio autoplay th:src="${audio}"></audio>
</div>

<h2 th:text="${message}" style="color: #fff; text-shadow: 0 0 10px red;">SCENARIO TEXT</h2>

<br><br>
<a th:href="@{/}" style="color: #00ff00; font-size: 22px; text-decoration: none; border: 2px solid #00ff00; padding: 10px 20px;">[ RETURN TO SECURITY ROOM ]</a>
</body>
</html>
